<!doctype html>
<!-- PLANTILLA de la página de una noticia. No se publica tal cual: el build (npm run build) genera una página
     blog/<id>.html por cada archivo de content/blog/, con su título, descripción e imagen para compartir. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticia · UPCT Racing Team</title>
  <meta name="description" content="Noticia del UPCT Racing Team.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="UPCT Racing Team">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Noticia · UPCT Racing Team">
  <meta property="og:description" content="Noticia del UPCT Racing Team.">
  <meta property="og:image" content="assets/img/og/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Monoplaza del UPCT Racing Team de frente, con el nombre del equipo">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="data/site.js"></script>
  <script src="data/sponsors.js"></script>
  <script src="data/blog.js"></script>
  <script src="data/i18n-en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/posts.js" defer></script>
  <script src="js/noticia.js" defer></script>
</head>
<body>
  <site-header current="blog"></site-header>

  <main id="contenido" tabindex="-1">

    <!-- Misma cabecera que la página Blog (el único h1 de la página es el título de la noticia; este es un h2 con el mismo aspecto) -->
    <header class="page-head">
      <span class="diag" aria-hidden="true"></span>
      <div class="container">
        <h2 class="t-page">Blog</h2>
        <p class="lede">Lo que pasa en el taller, en pista y fuera de ella.</p>
      </div>
    </header>

    <section class="section section--flush-top" id="articulo" aria-label="Noticia">
      <article class="container" id="articulo-root"></article>
    </section>

  </main>

  <site-footer></site-footer>
</body>
</html>
