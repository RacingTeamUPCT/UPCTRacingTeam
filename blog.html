<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Noticias del UPCT Racing Team: lo que pasa en el taller, en pista y fuera de ella.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UPCT Racing Team">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Blog · UPCT Racing Team">
  <meta property="og:description" content="Noticias del equipo: taller, competición y novedades.">
  <meta property="og:image" content="assets/img/og/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Monoplaza del UPCT Racing Team de frente, con el nombre del equipo">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="data/site.js"></script>
  <script src="data/sponsors.js"></script>
  <script src="data/blog.js"></script>
  <script src="data/i18n-en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/posts.js" defer></script>
  <script src="js/blog.js" defer></script>
</head>
<body>
  <site-header current="blog"></site-header>

  <main id="contenido" tabindex="-1">

    <header class="page-head">
      <span class="diag" aria-hidden="true"></span>
      <div class="container">
        <h1 class="t-page">Blog</h1>
        <p class="lede">Lo que pasa en el taller, en pista y fuera de ella.</p>
      </div>
    </header>

    <!-- Lista de noticias (js/blog.js, desde data/blog.js) -->
    <section class="section section--flush-top" id="lista" aria-label="Noticias">
      <div class="container" id="blog-root"></div>
    </section>

    <!-- Noticia abierta: se muestra al entrar con blog.html#identificador -->
    <section class="section section--flush-top" id="articulo" aria-label="Noticia" hidden>
      <article class="container" id="articulo-root"></article>
    </section>

    <noscript>
      <div class="container pb-section">
        <p class="pending-box">Esta página necesita JavaScript para mostrar las noticias.</p>
      </div>
    </noscript>

  </main>

  <site-footer></site-footer>
</body>
