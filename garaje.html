<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garaje · UPCT Racing Team</title>
  <meta name="description" content="El garaje del UPCT Racing Team: el monoplaza y los departamentos que lo hacen posible, con acceso directo al equipo de cada departamento.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UPCT Racing Team">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Garaje · UPCT Racing Team">
  <meta property="og:description" content="El monoplaza y los departamentos que lo hacen posible.">
  <meta property="og:image" content="assets/img/og/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Monoplaza del UPCT Racing Team de frente, con el nombre del equipo">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="data/site.js"></script>
  <script src="data/sponsors.js"></script>
  <script src="data/departments-garage.js"></script>
  <script src="data/coche.js"></script>
  <script src="data/i18n-en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/garaje.js" defer></script>
  <script src="js/coche3d.js" defer></script>
  <script src="js/visor.js" defer></script>
</head>
<body>
  <site-header current="garaje"></site-header>

  <main id="contenido" tabindex="-1">

    <section class="garage" aria-labelledby="garaje-titulo">
      <span class="diag" aria-hidden="true"></span>

      <div class="container garage__grid">

        <!-- Texto + lista de departamentos (se genera desde data/departments-garage.js) -->
        <div class="garage__col">
          <div class="garage__intro">
            <h1 class="t-page" id="garaje-titulo">Garaje</h1>
          </div>
          <ul class="garage-list" id="garage-list" role="list"></ul>
          <noscript><p class="pending-box">Esta lista necesita JavaScript. Puedes ver todos los departamentos en la página <a href="equipo.html">Equipo</a>.</p></noscript>
        </div>

        <!-- ======================================================================
             FASE 2 — VISOR 3D
             Aquí irá el visor 3D del coche (assets/models/coche.glb).
             · Contenedor reservado: #visor-3d, con proporción definida (--visor-ratio: 16 / 10).
             · En la fase 2 se sustituye SOLO el <img class="stage__media"> por el visor
               (dentro de .stage__viewer). El fondo negro, el foco de luz, el viñeteado y
               la lista de departamentos ya son los definitivos.
             · Las zonas pinchables saldrán de data/departments-garage.js (campo zonaCoche).
             ====================================================================== -->
        <div class="garage__visor visor-wrap">
          <span class="stripes" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="stage" id="visor-3d" data-visor="garaje" style="--visor-ratio: 3 / 2">
            <noscript><img class="stage__media" src="assets/img/coche/recorte.png" width="1200" height="663" alt="Monoplaza del UPCT Racing Team, número 261"></noscript>
          </div>
        </div>

      </div>
    </section>

  </main>

  <site-footer></site-footer>
</body>
</html>
